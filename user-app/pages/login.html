    <title>ShowPay Login | Secure Account Access</title>

    <!-- Google Site Name & Open Graph (For Social & SERP Name) -->

    <!-- Twitter Tags -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://app-showpay.in/assets/showpay-og-image.jpg" />

    <!-- Logo / Favicon -->
    <link rel="icon" type="image/png" href="https://app-showpay.in/assets/logo.png" sizes="32x32">
    <link rel="apple-touch-icon" href="https://app-showpay.in/assets/logo-large.png">

    <!-- Performance Optimizations -->
    <link rel="preload" href="../css/common.css" as="style" />
    <link rel="preload" href="../css/login.css" as="style" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login.css" />
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.min.js"></script>
    
    <!-- Advanced SEO Schema Markup (JSON-LD for Google Auto-Discovery) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://app-showpay.in/#website",
          "url": "https://app-showpay.in/",
          "name": "Showpay Login",
          "alternateName": ["ShowPay", "Show Pay", "ShowPay App", "Show Pay Login", "ShowPay apk"],
          "description": "ShowPay Login - Secure payment gateway and official ShowPay app"
        },
        {
          "@type": "Organization",
          "@id": "https://app-showpay.in/#organization",
          "name": "Showpay Login",
          "url": "https://app-showpay.in/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://app-showpay.in/assets/logo.png",
            "width": 512,
            "height": 512
          },
          "sameAs": [
            "https://t.me/bolinshowpay1"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "Customer Support",
            "url": "https://app-showpay.in/"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div class="login-container">
      <h1 class="header" style="font-size: 24px; text-align: center; margin-bottom: 10px;">ShowPay Login</h1>
      
      <p style="text-align: center; font-size: 14px; margin-bottom: 20px;">
        <a href="/" style="color: #3b82f6; text-decoration: none;">&larr; Back to Home</a>
      </p>
      
      <div style="background: #fffbeb; color: #92400e; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; text-align: center; border: 1px solid #fcd34d;">
        <strong>Security Warning:</strong> Always verify you are on <em>app-showpay.in</em> before entering your credentials. ShowPay will never ask for your password.
      </div>

      <form id="loginForm">
        <div class="form-group">
          <i data-lucide="phone" class="input-icon"></i>
          <input
            type="tel"
            id="mobile"
            class="form-control"
            placeholder="Enter Your Phone Number"
            maxlength="10"
            required
          />
        </div>

        <div class="form-group">
          <i data-lucide="lock" class="input-icon"></i>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter Password"
            required
          />
        </div>

        <div class="forgot-password">
          <a href="https://app-web.showpay-web.com/forgetPassword">Forget Password</a>
        </div>

        <div
          id="errorMessage"
          class="hidden"
          style="
            color: red;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
          "
        ></div>

        <div class="login-btn-container">
          <button type="submit" class="btn-primary" id="loginBtn">
            LOG IN
          </button>
        </div>

        <div class="register-link-container">
          <span>Don't have an account?</span> <a href="https://app-web.showpay-web.com/regist?code=2invite5p6">Register</a>
        </div>
      </form>
    </div>



    <script type="module" src="../js/config/supabase.js"></script>
    <script type="module" src="../js/auth/login.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
