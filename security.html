<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${page.title}</title>
    <meta name="description" content="${page.desc}">
    <link rel="canonical" href="${domain}/${page.name.replace('.html', '')}" />
    
    <meta property="og:title" content="${page.title}" />
    <meta property="og:description" content="${page.desc}" />
    <meta property="og:url" content="${domain}/${page.name.replace('.html', '')}" />
    <meta property="og:type" content="article" />
    
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="${page.title}" />
    <meta name="twitter:description" content="${page.desc}" />
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        line-height: 1.6;
      }
      header {
        background: #1e293b;
        padding: 20px;
        text-align: center;
        border-bottom: 1px solid #334155;
      }
      header a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 600;
        font-size: 18px;
      }
      main {
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        color: #f8fafc;
        font-size: 32px;
        margin-bottom: 24px;
      }
      h2 {
        color: #e2e8f0;
        font-size: 24px;
        margin-top: 32px;
        margin-bottom: 16px;
      }
      p {
        margin-bottom: 16px;
        color: #94a3b8;
      }
      a {
        color: #3b82f6;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      nav.breadcrumb {
        margin-bottom: 20px;
        font-size: 14px;
        color: #64748b;
      }
      footer {
        text-align: center;
        padding: 40px 20px;
        margin-top: 60px;
        border-top: 1px solid #334155;
        color: #64748b;
        font-size: 14px;
      }
    </style>
    ${page.jsonld ? `<script type="application/ld+json">${page.jsonld}</script>` : ''}
    <!-- Breadcrumb JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [{
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "${domain}/"
      },{
        "@type": "ListItem",
        "position": 2,
        "name": "${page.h1}",
        "item": "${domain}/${page.name.replace('.html', '')}"
      }]
    }
    </script>
  </head>
  <body>
    <header>
      <a href="/">ShowPay</a>
    </header>
    <main>
      <nav class="breadcrumb">
        <a href="/">Home</a> &gt; <span>${page.h1}</span>
      </nav>
      <h1>${page.h1}</h1>
      ${page.content}
    </main>
    <footer>
      <p>&copy; 2024 ShowPay. <a href="/privacy-policy">Privacy</a> | <a href="/terms">Terms</a> | <a href="/support">Support</a></p>
    </footer>
  </body>
</html>
